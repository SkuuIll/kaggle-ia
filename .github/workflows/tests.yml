name: Project checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sistema/requirements.lock.txt
      - run: python -m unittest discover -s sistema/tests -p 'tests_*.py' -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sistema/web/dashboard.js && node --check sistema/web/chat/workspace.js
      - run: node --test sistema/tests/chat-workspace.test.cjs
      - run: npm --prefix sistema/web/frontend ci
      - run: npm --prefix sistema/web/frontend run build
