name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sistema/requirements.lock.txt
      - run: python -m unittest discover -s sistema -p 'tests_*.py' -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check sistema/dashboard.js
